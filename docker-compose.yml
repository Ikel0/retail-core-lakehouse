name: retail-core-lakehouse

services:
  retail-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: retail-core-lakehouse:latest
    ports:
      - "8042:8042"
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8042/api/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s

  dbt:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    image: retail-core-dbt:1.11
    working_dir: /workspace
    volumes:
      - ./data:/workspace/data
      - ./reports:/workspace/reports
    command: ["python", "-m", "src.dbt_runner", "build"]

  localstack:
    profiles: ["platform", "tools"]
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3,kinesis,cloudwatch,logs
      AWS_DEFAULT_REGION: eu-west-3
      KINESIS_LATENCY: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  aws-bootstrap:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/platform.Dockerfile
    image: retail-core-platform:latest
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-3
    volumes:
      - ./data:/workspace/data
      - ./reports:/workspace/reports
    depends_on:
      localstack:
        condition: service_healthy
    command: ["python", "-m", "src.aws_local"]

  airflow:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: retail-core-airflow:3.3.1
    init: true
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/project
      RETAIL_CORE_ROOT: /opt/airflow/project
      RETAIL_CORE_AWS_MODE: localstack
      DBT_PYTHON: /opt/airflow/dbt-venv/bin/python
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-3
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    depends_on:
      localstack:
        condition: service_healthy
    command: standalone
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

volumes:
  localstack-data:
