name: retail_core
version: "3.0.0"
config-version: 2
profile: retail_core
model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["dbt_tests"]
clean-targets: ["target", "dbt_packages"]
models:
  retail_core:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["retail", "staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["retail", "identity_resolution"]
    marts:
      +materialized: table
      +schema: core
      +tags: ["retail", "core_model"]
